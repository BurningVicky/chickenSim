<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if object %}Editar Raça{% else %}Nova Raça{% endif %} - Chicken Sim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
    <a href="{% url 'raca_list' %}" class="text-sm text-slate-600 hover:text-slate-900">
      &larr; Voltar para Raças
    </a>
    <form method="post" action="{% url 'logout' %}" class="inline">
      {% csrf_token %}
      <button type="submit" class="text-sm text-red-600 hover:underline font-medium">Sair</button>
    </form>
  </nav>

  <main class="max-w-xl mx-auto px-6 py-8">
    <div class="bg-white p-6 rounded-lg border border-slate-200 shadow-xs space-y-5">
      <h1 class="text-xl font-bold text-slate-900">
        {% if object %}Editar Raça{% else %}Cadastrar Nova Raça{% endif %}
      </h1>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
          <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">
              {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
              <p class="text-xs text-red-600 mt-1">{{ field.errors|striptags }}</p>
            {% endif %}
          </div>
        {% endfor %}

        <div class="pt-2 flex justify-end gap-3">
          <a href="{% url 'raca_list' %}" class="px-4 py-2 text-sm text-slate-600 hover:text-slate-900">Cancelar</a>
          <button type="submit" class="bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded hover:bg-slate-800">
            Salvar
          </button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
